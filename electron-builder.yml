# Packaging for the desktop build.
#
# The renderer is already bundled by Vite, so nothing from node_modules needs to
# ship: the app is dist/ plus the four files in desktop/. Excluding it keeps the
# installer around 90 MB instead of several hundred.

appId: au.edu.swin.cos20007.swinlearn
productName: SwinLearn OOP
copyright: SwinLearn OOP — COS20007 coursework companion

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - desktop/**/*
  - package.json
  - '!node_modules/**/*'

asar: true
npmRebuild: false

# Package the Electron that npm already installed, rather than downloading and
# extracting a second copy into release/. Same version by construction, one less
# download, and it sidesteps a Windows EPERM when a virus scanner still holds a
# handle on the freshly extracted electron.exe as the builder tries to rename it.
electronDist: node_modules/electron/dist

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName} ${version} ${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SwinLearn OOP
  # Student work lives in %APPDATA%; an uninstall must not touch it.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName} ${version} portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]

linux:
  icon: build/icon.png
  category: Education
  target:
    - AppImage
    - deb
